name: Nightly GMS Release Build

on:
  schedule:
    - cron: '0 0 * * *' # Every night at 00:00 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  build_nightly:
    name: Build Universal GMS Release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore ~/.android
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Setting up production release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found, generating build keystore..."
            keytool -genkey -v -keystore app/keystore/release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AURASATH,O=AURASATH,C=US"
          fi
          cp app/keystore/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal GMS Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5120m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.parallel=true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease -Pnightly=true -PnightlyRun=${{ github.run_number }} --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aurasath-gms-nightly
          path: app/build/outputs/apk/universalGms/release/*.apk
