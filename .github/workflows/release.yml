name: Stable Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v6.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal GMS Stable Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Validate release tag and set app version
        id: version
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          fi
          if [[ ! "${RAW_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: ${RAW_TAG}. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((10#${MAJOR} * 10000 + 10#${MINOR} * 100 + 10#${PATCH}))
          printf 'VERSION_MAJOR=%s\nVERSION_MINOR=%s\nVERSION_PATCH=%s\nVERSION_CODE=%s\n' \
            "${MAJOR}" "${MINOR}" "${PATCH}" "${VERSION_CODE}" > version.properties
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Configure dedicated release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          mkdir -p app/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal GMS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary --stacktrace -x lint

      - name: Verify APK version metadata
        run: |
          APK_FILE=$(find app/build/outputs/apk/universalGms/release/ -name "*.apk" -print -quit)
          test -n "$APK_FILE"
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt" dump badging "$APK_FILE" | grep -F "versionName='${{ steps.version.outputs.version }}'"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt" dump badging "$APK_FILE" | grep -F "versionCode='${{ steps.version.outputs.version_code }}'"

      - name: Prepare Release Distribution Assets
        run: |
          set -euo pipefail
          mkdir -p release-dist
          APK_FILE=$(find app/build/outputs/apk/universalGms/release/ -name "*.apk" -print -quit)
          cp "$APK_FILE" "release-dist/AURASATH-${{ steps.version.outputs.tag }}.apk"
          if [ -f changelog.json ]; then
            cp changelog.json release-dist/changelog.json
          fi

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AURASATH ${{ steps.version.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-dist/*.apk
            release-dist/changelog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurasath-gms-release
          path: release-dist/*.apk
