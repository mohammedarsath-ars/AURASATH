name: Stable Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v6.1.1)'
        required: true
        default: 'v6.1.1'
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal & ARM64 GMS Stable Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore ~/.android
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Setting up production release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found, generating build keystore..."
            keytool -genkey -v -keystore app/keystore/release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AURASATH,O=AURASATH,C=US"
          fi
          cp app/keystore/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal & ARM64 GMS Release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5120m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.parallel=true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease assembleArm64GmsRelease --no-configuration-cache --console=plain --warning-mode summary --stacktrace -x lint

      - name: Prepare Release Distribution Assets
        id: prep
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            RAW_TAG="${{ inputs.tag }}"
          fi
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="v6.1.1"
          fi
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT

          mkdir -p release-dist
          
          # Find Universal APK
          UNIVERSAL_APK=$(find app/build/outputs/apk/universalGms/release/ -name "*.apk" | head -n 1)
          if [ -f "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" "release-dist/AURASATH-${RAW_TAG}-Universal.apk"
            echo "Copied Universal APK"
          fi

          # Find ARM64 APK
          ARM64_APK=$(find app/build/outputs/apk/arm64Gms/release/ -name "*.apk" | head -n 1)
          if [ -f "$ARM64_APK" ]; then
            cp "$ARM64_APK" "release-dist/AURASATH-${RAW_TAG}-arm64.apk"
            echo "Copied ARM64 APK"
          fi

          if [ -f changelog.json ]; then
            cp changelog.json release-dist/changelog.json
          fi

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "AURASATH ${{ steps.prep.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            release-dist/*.apk
            release-dist/changelog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurasath-gms-release
          path: release-dist/*.apk
