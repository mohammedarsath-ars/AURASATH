name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore ~/.android
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Setting up production release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found, generating build keystore..."
            keytool -genkey -v -keystore app/keystore/release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AURASATH,O=AURASATH,C=US"
          fi
          cp app/keystore/release.keystore ~/.android/debug.keystore

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Universal & ARM64 Release APKs
        run: |
          set -o pipefail
          ./gradlew assembleUniversalGmsRelease assembleArm64GmsRelease --stacktrace --no-daemon -x lint 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5120m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.parallel=true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURASATH-release-apks
          path: |
            app/build/outputs/apk/universalGms/release/*.apk
            app/build/outputs/apk/arm64Gms/release/*.apk

      - name: Prepare Release Distribution Assets
        run: |
          mkdir -p release-dist
          UNIVERSAL_APK=$(find app/build/outputs/apk/universalGms/release/ -name "*.apk" | head -n 1)
          if [ -f "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" "release-dist/AURASATH-v1.0.0-Universal.apk"
            echo "Copied Universal APK"
          fi
          ARM64_APK=$(find app/build/outputs/apk/arm64Gms/release/ -name "*.apk" | head -n 1)
          if [ -f "$ARM64_APK" ]; then
            cp "$ARM64_APK" "release-dist/AURASATH-v1.0.0-arm64.apk"
            echo "Copied ARM64 APK"
          fi
          if [ -f changelog.json ]; then
            cp changelog.json release-dist/changelog.json
          fi

      - name: Publish Official GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AURASATH v1.0.0 Flagship Release"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ProGuard/R8 Mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-gms-mapping
          path: app/build/outputs/mapping/universalGmsRelease/mapping.txt
          if-no-files-found: ignore

      - name: Upload Build Failure Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: build.log

      - name: Dump Failure Log to Step Summary
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push Build Log to Debug Branch
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-build-log
          if [ -f build.log ]; then
            git add -f build.log
          fi
          MAPPING_FILE="app/build/outputs/mapping/universalGmsRelease/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            mkdir -p debug-output
            cp "$MAPPING_FILE" debug-output/mapping.txt
            git add -f debug-output/mapping.txt
          fi
          git commit -m "ci: capture build log and mapping" || true
          git push origin ci-build-log --force || true